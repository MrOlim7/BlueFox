[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "BlueFox"
dynamic = ["version"]
description = "BlueFox terminal toolkit — v3 foundation alpha"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
full = [
  "pystyle>=2.9,<3", "python-whois>=0.9,<1", "dnspython>=2.6,<3",
  "Pillow>=10,<13", "beautifulsoup4>=4.12,<5", "pypresence>=4.3,<5",
]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
bluefox = "BlueFox:main"

[tool.setuptools]
py-modules = ["BlueFox"]

[tool.setuptools.packages.find]
include = ["Program*"]

[tool.setuptools.dynamic]
version = {attr = "Program.version.__version__"}

[tool.setuptools.exclude-package-data]
Program = ["bluefox_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
